# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  # SCRUM-42: per-client exchange layout, shipped once as a shared classpath resource in
  # platform-batch and imported by each writer service; drives the ExchangeLayout bean.
  config:
    import: classpath:dcre-exchange-layout.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
    hikari:
      # SCRUM-90: crg-ONLY READ COMMITTED (not fleet-wide). crg is the sole service whose
      # concurrent report jobs hit an uncatchable 40001 (RETRY_SERIALIZABLE) at the Batch-6
      # persistent-JobRepository chunk commit; READ COMMITTED removes it and crg's writes are
      # full-identity guarded UPSERTs (ON CONFLICT (client,e2e)) so zero-dup is preserved.
      # It is NOT applied fleet-wide because ctv/rpt use cluster_logical_timestamp() /
      # AS OF SYSTEM TIME, which CockroachDB supports only under SERIALIZABLE. Every other
      # stage stays on the SERIALIZABLE default.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CRG_BATCH_). The history
    # table names the SERVICE that owns the changelog, so they follow the PRG -> CRG rename.
    database-change-log-table: crg_databasechangelog
    database-change-log-lock-table: crg_databasechangeloglock

dcre:
  # Telemetry marker, read by platform-batch. Everything else about telemetry (the service name,
  # the instance id, the export flag, the flush, the log appender and the trace context) is
  # resolved inside the library, so this file carries no telemetry configuration of its own and
  # cannot drift from its 29 siblings.
  #
  # Disabled by default: a service run outside the orchestrator behaves exactly as before, and a
  # fresh clone runs with no .env at all (12FactorApp Alignment, https://12factor.net/).
  telemetry:
    enabled: ${DCRE_TELEMETRY_ENABLED:false}
    # OPTIONAL override. Left unset, the library takes this service's own application package
    # leaf, so no service restates its own name here.
    stage: ${DCRE_TELEMETRY_STAGE:}
  batch:
    table-prefix: CRG_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  crg:
    # SCRUM-42: whole-book reads + a full in-heap render blew CRDB's sql memory
    # budget on the 30M-tx book; PSR reads, streaming emission and watermark
    # advances all run in bounded keyset slices of this size.
    psr-slice-size: ${DCRE_CRG_PSR_SLICE_SIZE:50000}
