plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'za.co.fnb.dcre'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral(); mavenLocal() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'za.co.fnb.dcre:dcre-platform-persistence:0.1.0'
    implementation 'za.co.fnb.dcre:dcre-platform-files:0.1.0'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springframework.boot:spring-boot-liquibase'
    implementation 'za.co.fnb.dcre:dcre-platform-batch:0.1.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
}
test { useJUnitPlatform() }
